[project]
name = "vecho"
version = "0.1.0"
description = "Record two-way voice conversations and transcribe and summarize them entirely on your own machine."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nhahan", email = "kisy324@naver.com" }]
keywords = ["voice", "recording", "transcription", "summarization", "whisper", "ollama"]
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Capture/Recording",
]
dependencies = [
    "numpy>=1.26",
    "sounddevice>=0.5",
    "faster-whisper>=1.1.0",
    "soundcard>=0.4.3; sys_platform != 'darwin'",
    # Runs Whisper on the Apple Silicon GPU; much faster than CPU-only faster-whisper there.
    "mlx-whisper>=0.4.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
desktop = ["pywebview>=5.0"]

[project.scripts]
vecho = "vecho.cli:main"

[project.gui-scripts]
vecho-app = "vecho.cli:open_app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vecho"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
