name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Sound library (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - run: uv run --python 3.12 pytest
      - run: uv run --python 3.12 ruff check .
        if: runner.os == 'Linux'

  # What a new user does: the one-line installer, then summarizing a recording file.
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      VECHO_SOURCE: ${{ github.workspace }}
      VECHO_NO_OPEN: "1"
      # small models keep the run short; the installer's own choices are tested above
      VECHO_LLM_MODEL: qwen3:4b
      VECHO_WHISPER_MODEL: small
      VECHO_LLM_TIMEOUT: "900"
    steps:
      - uses: actions/checkout@v4

      - name: Install (macOS, Linux)
        if: runner.os != 'Windows'
        run: sh install.sh

      - name: Run the summary AI on the CPU (CI Macs are VMs without a usable GPU for it)
        if: runner.os == 'macOS'
        run: echo "VECHO_LLM_NUM_GPU=0" >> "$GITHUB_ENV"

      - name: Install (Windows)
        if: runner.os == 'Windows'
        shell: powershell
        # exactly what a user pastes (the script of this commit)
        run: irm https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/install.ps1 | iex

      - name: Put the installed commands on PATH
        shell: bash
        run: echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Shortcut exists
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS) test -x "$HOME/Applications/vecho.app/Contents/MacOS/vecho" ;;
            Windows) test -f "$APPDATA/Microsoft/Windows/Start Menu/Programs/vecho.lnk" ;;
            Linux) test -f "$HOME/.local/share/applications/vecho.desktop" ;;
          esac

      - name: Summarize a recording
        shell: bash
        run: |
          vecho doctor || true
          vecho import --mixed tests/data/sample-ko.m4a --title "설치 확인"
          vecho show --transcript
          vecho show | tee summary.txt
          grep -Eq "김민수|회의|화요일|발표" summary.txt

      - name: Ollama's log (when something failed)
        if: failure() && runner.os != 'Windows'
        shell: bash
        run: tail -n 80 ~/.ollama/logs/server.log 2>/dev/null || journalctl -u ollama --no-pager | tail -n 80 || true

      - name: The app starts
        shell: bash
        run: |
          vecho app --no-open > app.log 2>&1 &
          for i in $(seq 1 30); do grep -q "running at" app.log && break; sleep 1; done
          cat app.log
          grep -q "running at" app.log
